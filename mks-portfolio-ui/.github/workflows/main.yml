name: CI/CD

on:
  push:
    branches:
      - develop
      - '*MWP*'  # Trigger for branches containing 'MWP'
  pull_request:
    branches:
      - develop  # Trigger on pull request targeting 'develop'

jobs:
  # Build and Deploy Job
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          persist-credentials: false  # Disable default credentials persisting

      # Step 2: Set up Git with PAT for authentication
      - name: Configure Git for Authentication
        run: git config --global url."https://${{ secrets.PAT }}@github.com/".insteadOf ssh://git@github.com/

      # Step 3: Set up Node.js (Node.js 12.x)
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '12.x'  # Use Node.js 12.x

      # Step 4: Install Dependencies (Clean Install)
      - name: Install Dependencies
        run: npm ci  # Clean install to ensure consistent builds

      # Step 5: Build the Angular App
      - name: Build Angular App
        run: npm run build --prod

      # Step 6: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.0
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: testers
          file: dist/mks-portfolio-ui  # Path to your built app
