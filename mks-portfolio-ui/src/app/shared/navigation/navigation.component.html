    <!-- Hamburger icon for mobile -->
    <div class="hamburger" id="hamburger-icon" (click)="onOpen()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30">
            <path fill="none" d="M0 0h24v24H0z" />
            <path
                d="M4 6h16c.553 0 1 .447 1 1s-.447 1-1H4c-.553 0-1-.447-1-1s.447-1 1-1zm0 5h16c.553 0 1 .447 1 1s-.447-1-1H4c-.553 0-1-.447-1-1s.447-1 1-1zm0 5h16c.553 0 1 .447 1 1s-.447 1-1-1H4c-.553 0-1-.447-1-1s.447-1 1-1z" />
        </svg>
    </div>

    <ul id="nav-links" (click)="setActiveLink(activeLink)" [class.open]="isOpen">
        <li *ngFor="let link of navLinks; let i = index" 
            [class.active]="activeLink === link">
            <a (click)="setActiveLink(link, i)"
               (keydown)="onKeyDown($event)"
               tabindex="0">
               {{ link | titlecase }}
            </a>
        </li>
        <li *ngIf="isMobile">
            <a (click)="onDownload()" tabindex="0">Download Resume</a>
        </li>
    </ul>

    <button type="button" (click)="onDownload()">Download Resume</button>
</nav>
